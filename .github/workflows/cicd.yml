name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ── Change detection ────────────────────────────────
  # Per-package path filter. Tag pushes ignore these outputs
  # (each job ORs in `startsWith(github.ref, 'refs/tags/v')`),
  # so a release always runs the full pipeline.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      pwa: ${{ steps.filter.outputs.pwa }}
      worker: ${{ steps.filter.outputs.worker }}
      site: ${{ steps.filter.outputs.site }}

    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension:
              - 'extension/**'
              - 'shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/cicd.yml'
            pwa:
              - 'pwa/**'
              - 'shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/cicd.yml'
            worker:
              - 'worker/**'
              - '.github/workflows/cicd.yml'
            site:
              - 'site/**'
              - '.github/workflows/cicd.yml'

  # ── CI ──────────────────────────────────────────────
  extension-check:
    name: Extension — Lint, Typecheck, Test, Build
    needs: changes
    if: >-
      ${{ !cancelled() &&
      (needs.changes.outputs.extension == 'true' ||
      startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter moo-family-bookshelf-extension lint

      - name: Typecheck
        run: pnpm --filter moo-family-bookshelf-extension typecheck

      - name: Test
        run: pnpm --filter moo-family-bookshelf-extension test

      - name: Build
        run: pnpm --filter moo-family-bookshelf-extension build

  worker-check:
    name: Worker — Lint, Typecheck, Test
    needs: changes
    if: >-
      ${{ !cancelled() &&
      (needs.changes.outputs.worker == 'true' ||
      startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  pwa-check:
    name: PWA — Lint, Typecheck, Test, Build
    needs: changes
    if: >-
      ${{ !cancelled() &&
      (needs.changes.outputs.pwa == 'true' ||
      startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter moo-family-bookshelf-pwa typecheck

      - name: Lint
        run: pnpm --filter moo-family-bookshelf-pwa lint

      - name: Test
        run: pnpm --filter moo-family-bookshelf-pwa test

      - name: Build
        run: pnpm --filter moo-family-bookshelf-pwa build

  e2e:
    name: E2E — Playwright Chrome Extension Tests
    needs: [changes, extension-check, worker-check]
    # Run when extension OR worker changed (E2E exercises both), or on a tag.
    # !cancelled() overrides the default skip when worker-check was filtered out.
    if: >-
      ${{ !cancelled() &&
      needs.extension-check.result != 'failure' &&
      needs.worker-check.result != 'failure' &&
      (needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.worker == 'true' ||
      startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension (E2E variant)
        working-directory: extension
        run: pnpm build:e2e

      - name: Typecheck E2E tests
        working-directory: extension
        run: npx tsc --noEmit --project tests/e2e/tsconfig.json

      - name: Install Playwright browsers
        working-directory: extension
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: extension
        run: xvfb-run --auto-servernum pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-extension
          path: extension/playwright-report/
          retention-days: 7

  pwa-e2e:
    name: PWA E2E — Playwright Tests
    needs: [changes, pwa-check, worker-check]
    # Run when pwa OR worker changed, or on a tag.
    if: >-
      ${{ !cancelled() &&
      needs.pwa-check.result != 'failure' &&
      needs.worker-check.result != 'failure' &&
      (needs.changes.outputs.pwa == 'true' ||
      needs.changes.outputs.worker == 'true' ||
      startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PWA
        working-directory: pwa
        run: pnpm build

      - name: Typecheck E2E tests
        working-directory: pwa
        run: npx tsc --noEmit --project tests/e2e/tsconfig.json

      - name: Install Playwright browsers
        working-directory: pwa
        run: npx playwright install chromium --with-deps

      - name: Run PWA E2E tests
        working-directory: pwa
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-pwa
          path: pwa/playwright-report/
          retention-days: 7

  # ── CI gate ─────────────────────────────────────────
  # Single aggregate status for branch protection. Always runs; passes when
  # every CI job either succeeded or was path-filtered (skipped), and fails
  # only on a real failure/cancellation. Set THIS as the required check —
  # never the individual jobs, which skip under path filtering and would
  # otherwise block merges forever.
  ci-success:
    name: CI Success
    needs: [extension-check, worker-check, pwa-check, e2e, pwa-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify no CI job failed
        run: |
          results="${{ needs.extension-check.result }} ${{ needs.worker-check.result }} ${{ needs.pwa-check.result }} ${{ needs.e2e.result }} ${{ needs.pwa-e2e.result }}"
          echo "CI job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass (result=$r)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped by path filtering."

  # ── CD: Dev (push to main) ─────────────────────────
  # Dev deploys are path-gated: a package only redeploys when it changed.
  # The if has no always()/!cancelled(), so needs-skip propagation skips
  # the deploy when its check job was filtered out.
  deploy-worker-dev:
    name: Deploy Worker (Dev)
    needs: [changes, worker-check]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare (Dev)
        run: |
          sed -i "s/YOUR_DEV_KV_NAMESPACE_ID/${{ secrets.KV_NAMESPACE_ID_DEV }}/" wrangler.toml
          pnpm run deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pwa-dev:
    name: Deploy PWA (Dev)
    needs: [changes, pwa-check]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.pwa == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build PWA (Dev)
        run: pnpm --filter moo-family-bookshelf-pwa build:dev

      - name: Deploy to Cloudflare Pages (Dev)
        run: npx wrangler pages deploy pwa/dist --project-name=moo-family-bookshelf-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Deploy GitHub Pages
    needs: changes
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── CD: Prod (v* tag) ──────────────────────────────
  # Prod deploys are NOT path-gated — a release tag always runs the full
  # pipeline (the check/e2e jobs above OR in the tag condition).
  deploy-worker-prod:
    name: Deploy Worker (Prod)
    needs: [worker-check, e2e]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare (Prod)
        run: |
          sed -i "s/YOUR_PROD_KV_NAMESPACE_ID/${{ secrets.KV_NAMESPACE_ID_PROD }}/" wrangler.toml
          pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pwa-prod:
    name: Deploy PWA (Prod)
    needs: [pwa-check, pwa-e2e]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build PWA (Prod)
        run: pnpm --filter moo-family-bookshelf-pwa build

      - name: Deploy to Cloudflare Pages (Prod)
        run: npx wrangler pages deploy pwa/dist --project-name=moo-family-bookshelf --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release-extension:
    name: Build Extension Release
    needs: [extension-check, e2e]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter moo-family-bookshelf-extension build

      - name: Package Extension
        run: cd extension/dist && zip -r ../../moo-family-bookshelf-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s" --no-merges)
          else
            NOTES="Initial release"
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "$NOTES" \
            "moo-family-bookshelf-${TAG}.zip"
