name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ── Change detection ────────────────────────────────
  # Per-package path filter. Tag pushes ignore these outputs
  # (each job ORs in `startsWith(github.ref, 'refs/tags/v')`),
  # so a release always runs the full pipeline.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      pwa: ${{ steps.filter.outputs.pwa }}
      worker: ${{ steps.filter.outputs.worker }}
      site: ${{ steps.filter.outputs.site }}

    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension:
              - 'extension/**'
              - 'shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/cicd.yml'
            pwa:
              - 'pwa/**'
              - 'shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/cicd.yml'
            worker:
              - 'worker/**'
              - '.github/workflows/cicd.yml'
            site:
              - 'site/**'
              - '.github/workflows/cicd.yml'

  # ── CI ──────────────────────────────────────────────
  extension-check:
    name: Extension — Lint, Typecheck, Test, Build
    needs: changes
    if: >-
      ${{ !cancelled() &&
      (needs.changes.outputs.extension == 'true' ||
      startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter moo-family-bookshelf-extension lint

      - name: Typecheck
        run: pnpm --filter moo-family-bookshelf-extension typecheck

      - name: Test
        run: pnpm --filter moo-family-bookshelf-extension test

      - name: Build
        run: pnpm --filter moo-family-bookshelf-extension build

  worker-check:
    name: Worker — Lint, Typecheck, Test
    needs: changes
    if: >-
      ${{ !cancelled() &&
      (needs.changes.outputs.worker == 'true' ||
      startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  pwa-check:
    name: PWA — Lint, Typecheck, Test, Build
    needs: changes
    if: >-
      ${{ !cancelled() &&
      (needs.changes.outputs.pwa == 'true' ||
      startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter moo-family-bookshelf-pwa typecheck

      - name: Lint
        run: pnpm --filter moo-family-bookshelf-pwa lint

      - name: Test
        run: pnpm --filter moo-family-bookshelf-pwa test

      - name: Build
        run: pnpm --filter moo-family-bookshelf-pwa build

  e2e:
    name: E2E — Playwright Chrome Extension Tests
    needs: [changes, extension-check, worker-check]
    # Run when extension OR worker changed (E2E exercises both), or on a tag.
    # !cancelled() overrides the default skip when worker-check was filtered out.
    if: >-
      ${{ !cancelled() &&
      needs.extension-check.result != 'failure' &&
      needs.worker-check.result != 'failure' &&
      (needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.worker == 'true' ||
      startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension (E2E variant)
        working-directory: extension
        run: pnpm build:e2e

      - name: Typecheck E2E tests
        working-directory: extension
        run: npx tsc --noEmit --project tests/e2e/tsconfig.json

      - name: Install Playwright browsers
        working-directory: extension
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: extension
        run: xvfb-run --auto-servernum pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-extension
          path: extension/playwright-report/
          retention-days: 7

  pwa-e2e:
    name: PWA E2E — Playwright Tests
    needs: [changes, pwa-check, worker-check]
    # Run when pwa OR worker changed, or on a tag.
    if: >-
      ${{ !cancelled() &&
      needs.pwa-check.result != 'failure' &&
      needs.worker-check.result != 'failure' &&
      (needs.changes.outputs.pwa == 'true' ||
      needs.changes.outputs.worker == 'true' ||
      startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PWA
        working-directory: pwa
        run: pnpm build

      - name: Typecheck E2E tests
        working-directory: pwa
        run: npx tsc --noEmit --project tests/e2e/tsconfig.json

      - name: Install Playwright browsers
        working-directory: pwa
        run: npx playwright install chromium --with-deps

      - name: Run PWA E2E tests
        working-directory: pwa
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-pwa
          path: pwa/playwright-report/
          retention-days: 7

  # ── CI gate ─────────────────────────────────────────
  # Single aggregate status for branch protection. Always runs; passes when
  # every CI job either succeeded or was path-filtered (skipped), and fails
  # only on a real failure/cancellation. Set THIS as the required check —
  # never the individual jobs, which skip under path filtering and would
  # otherwise block merges forever.
  ci-success:
    name: CI Success
    needs: [extension-check, worker-check, pwa-check, e2e, pwa-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify no CI job failed
        run: |
          results="${{ needs.extension-check.result }} ${{ needs.worker-check.result }} ${{ needs.pwa-check.result }} ${{ needs.e2e.result }} ${{ needs.pwa-e2e.result }}"
          echo "CI job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass (result=$r)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped by path filtering."

  # ── CD: Dev (push to main) ─────────────────────────
  # Dev deploys are path-gated: a package only redeploys when it changed.
  # The if has no always()/!cancelled(), so needs-skip propagation skips
  # the deploy when its check job was filtered out.
  deploy-worker-dev:
    name: Deploy Worker (Dev)
    needs: [changes, worker-check]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare (Dev)
        run: |
          sed -i "s/YOUR_DEV_KV_NAMESPACE_ID/${{ secrets.KV_NAMESPACE_ID_DEV }}/" wrangler.toml
          pnpm run deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pwa-dev:
    name: Deploy PWA (Dev)
    needs: [changes, pwa-check]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.pwa == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build PWA (Dev)
        run: pnpm --filter moo-family-bookshelf-pwa build:dev

      - name: Deploy to Cloudflare Pages (Dev)
        run: npx wrangler pages deploy pwa/dist --project-name=moo-family-bookshelf-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Deploy GitHub Pages
    needs: changes
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── CD: Prod (v* tag) ──────────────────────────────
  # Prod deploys are NOT path-gated — a release tag always runs the full
  # pipeline (the check/e2e jobs above OR in the tag condition).
  deploy-worker-prod:
    name: Deploy Worker (Prod)
    needs: [worker-check, e2e]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare (Prod)
        run: |
          sed -i "s/YOUR_PROD_KV_NAMESPACE_ID/${{ secrets.KV_NAMESPACE_ID_PROD }}/" wrangler.toml
          pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pwa-prod:
    name: Deploy PWA (Prod)
    needs: [pwa-check, pwa-e2e]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build PWA (Prod)
        run: pnpm --filter moo-family-bookshelf-pwa build

      - name: Deploy to Cloudflare Pages (Prod)
        run: npx wrangler pages deploy pwa/dist --project-name=moo-family-bookshelf --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release-extension:
    name: Build Extension Release
    needs: [extension-check, e2e]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter moo-family-bookshelf-extension build

      - name: Package Extension
        run: cd extension/dist && zip -r ../../moo-family-bookshelf-chrome-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")

          # Curated, human-readable release notes live in a per-release file
          # authored before tagging (bilingual, categorised prose). When present
          # it becomes the top of the Release body; the auto-generated commit
          # list is always appended, collapsed inside a <details> block. When
          # absent, the Release falls back to just the commit list + changelog.
          NOTES_FILE="docs/release-notes/${TAG}.md"

          # Exclude non-user-facing commit types from the auto commit list.
          # Keeps feat/fix/refactor/perf/security and any non-conventional
          # subjects; drops docs/chore/ci/test/build/style (with optional
          # scope and breaking "!"). Conventional-commit prefixes only.
          EXCLUDE='^- (docs|chore|ci|test|build|style)(\(.+\))?!?:'

          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s" --no-merges | grep -vE "$EXCLUDE" || true)
            [ -z "$CHANGES" ] && CHANGES="_No user-facing changes._"
            COMPARE="${SERVER_URL}/${REPO}/compare/${PREV_TAG}...${TAG}"
          else
            CHANGES="_Initial release._"
            COMPARE=""
          fi

          # Warn (don't fail) when no curated notes exist, so the silent
          # fallback to the bare commit list is visible in the Actions log.
          [ -s "$NOTES_FILE" ] || echo "::warning::No curated release notes at ${NOTES_FILE} — falling back to the auto-generated commit list."

          # Assemble the Release body: curated notes (if any) → divider →
          # collapsible commit list → Full Changelog link. `-s` (exists AND
          # non-empty) so an accidentally blank notes file falls back cleanly
          # instead of emitting a stray divider with no content above it.
          {
            if [ -s "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
              printf '\n\n---\n\n'
            fi
            printf '<details>\n<summary>What'\''s Changed</summary>\n\n%s\n\n</details>\n' "$CHANGES"
            [ -n "$COMPARE" ] && printf '\n**Full Changelog**: %s\n' "$COMPARE"
          } > release-notes.md

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            "moo-family-bookshelf-chrome-${TAG}.zip"

  # Firefox produces TWO distribution channels, each with its OWN gecko id
  # (GECKO_ID_AMO vs GECKO_ID_DIRECT, see build-firefox-manifest.ts):
  #   - listed (AMO store):    `web-ext sign --channel=listed` submits the
  #     amo build (GECKO_ID_AMO) to addons.mozilla.org for review. It does NOT
  #     yield a local signed file — Mozilla serves/emails the signed add-on
  #     later. The AMO build must NOT carry update_url (AMO serves its own).
  #   - unlisted (self-dist):  `web-ext sign --channel=unlisted` returns a
  #     downloadable signed .xpi (direct build, GECKO_ID_DIRECT) we attach to
  #     the Release for direct install. This build carries update_url ->
  #     updates.json for auto-updates.
  # Because the two channels use DISTINCT gecko ids, they live in independent
  # version namespaces — there is no same-version dual-channel AMO conflict.
  # The listed submission still runs LAST so AMO review latency never blocks
  # the self-dist asset upload that already happened in earlier steps.
  release-extension-firefox:
    name: Build & Submit Firefox Extension (AMO + self-dist)
    needs: [extension-check, e2e, release-extension]
    # This job performs an IRREVERSIBLE side effect (AMO unlisted signing
    # consumes a version slot) and uploads to the GitHub Release that
    # release-extension creates. It must therefore run ONLY when that release
    # was actually created — i.e. release-extension SUCCEEDED. Guarding on
    # `result == 'success'` (instead of `!cancelled()`) prevents the job from
    # signing on AMO and then loud-failing at `gh release upload` because no
    # release exists (which would wedge the version on a fix-and-rerun).
    # e2e may be SKIPPED under path filtering on a tag; tolerate skip, but not
    # failure, so it is checked with `!= 'failure'` rather than `== 'success'`.
    if: >-
      ${{ !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.release-extension.result == 'success' &&
      needs.e2e.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 0. Anti-drift guard: the Firefox asset names and the GitHub Release tag
      #    derive from the git tag (github.ref_name, e.g. v1.5.0), while
      #    updates.json's version + update_link derive from extension/
      #    package.json. If these diverge, the signed .xpi is uploaded under the
      #    tag-based name while updates.json points update_link at a
      #    package.json-based URL that 404s — silently breaking Firefox
      #    auto-updates. Fail loudly here BEFORE any AMO signing if they differ.
      - name: Assert tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./extension/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG_VERSION  tag=$GITHUB_REF_NAME (stripped=$TAG_VERSION)"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension/package.json version $PKG_VERSION. Bump package.json before tagging."
            exit 1
          fi

      # 1. Build BOTH Firefox variants (dist-firefox-amo + dist-firefox-direct)
      #    and verify the update_url policy of each.
      - name: Build Firefox variants
        run: pnpm --filter moo-family-bookshelf-extension build:firefox

      # 2. Lint both variants with web-ext (fails the job on any error).
      #    The direct variant carries update_url, which web-ext flags as
      #    MANIFEST_UPDATE_URL ("not allowed for Mozilla-hosted add-ons").
      #    That add-on is self-hosted, not Mozilla-hosted, so --self-hosted
      #    suppresses that one (correct) error while keeping every other check.
      #    The amo variant is linted WITHOUT --self-hosted so AMO-hosting
      #    problems (including an accidental update_url) still fail the job.
      - name: web-ext lint (both variants)
        run: |
          npx web-ext lint --source-dir=extension/dist-firefox-amo
          npx web-ext lint --source-dir=extension/dist-firefox-direct --self-hosted

      # 3. Package the AMO-listed variant into a zip for the Release.
      - name: Package AMO zip
        run: cd extension/dist-firefox-amo && zip -r ../../moo-family-bookshelf-firefox-${{ github.ref_name }}-amo.zip .

      # 4. Generate the self-distribution update manifest (updates.json).
      - name: Generate updates.json
        run: cd extension && npx tsx scripts/build-updates-json.ts --out "$GITHUB_WORKSPACE/updates.json"

      # 5. Sign the direct-install variant on the unlisted channel — this DOES
      #    return a downloadable signed .xpi. Exactly one .xpi is expected; the
      #    rename step fails loudly otherwise.
      - name: Sign direct-install (unlisted)
        run: >-
          npx web-ext sign
          --source-dir=extension/dist-firefox-direct
          --artifacts-dir=extension/web-ext-artifacts-direct
          --channel=unlisted
          --no-input
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Rename signed .xpi
        run: |
          shopt -s nullglob
          xpis=(extension/web-ext-artifacts-direct/*.xpi)
          if [ "${#xpis[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 signed .xpi, found ${#xpis[@]}"
            exit 1
          fi
          XPI_NAME="moo-family-bookshelf-firefox-${GITHUB_REF_NAME}-direct-install.xpi"
          # Anti-drift: the uploaded .xpi name MUST equal the basename of
          # updates.json's update_link, or Firefox auto-update 404s. Fail loudly
          # if the two ever diverge (e.g. a name change in only one place).
          # Derive the (single) addons key from the file the builder wrote so
          # this guard follows GECKO_ID_DIRECT rather than a hardcoded literal.
          LINK_BASENAME=$(node -p "const u=require('$GITHUB_WORKSPACE/updates.json');u.addons[Object.keys(u.addons)[0]].updates[0].update_link.split('/').pop()")
          if [ "$XPI_NAME" != "$LINK_BASENAME" ]; then
            echo "::error::Asset name '$XPI_NAME' does not match updates.json update_link basename '$LINK_BASENAME'."
            exit 1
          fi
          mv "${xpis[0]}" "$GITHUB_WORKSPACE/$XPI_NAME"

      # Retain the built Firefox variants as a workflow artifact for
      # post-mortem / manual recovery, independent of the Release upload
      # succeeding (mirrors the traceability the pre-self-dist job provided).
      - name: Upload Firefox build artifacts
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: firefox-extension-builds
          path: |
            extension/dist-firefox-amo
            extension/dist-firefox-direct
          if-no-files-found: error
          retention-days: 7

      # 6. Upload the 3 Firefox assets to the SAME release/tag created by
      #    release-extension. --clobber makes re-runs idempotent.
      - name: Upload Firefox assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.ref_name }}"
          moo-family-bookshelf-firefox-${{ github.ref_name }}-amo.zip
          moo-family-bookshelf-firefox-${{ github.ref_name }}-direct-install.xpi
          updates.json
          --clobber

      # 7. Submit the AMO-listed variant LAST. --channel=listed enqueues the
      #    build for Mozilla review and yields NO local signed file. Running it
      #    after the self-dist upload means an AMO review hiccup (e.g. a
      #    same-version conflict with the unlisted submission) cannot block the
      #    downloadable .xpi from reaching the Release.
      - name: Sign & submit to AMO (listed)
        run: >-
          npx web-ext sign
          --source-dir=extension/dist-firefox-amo
          --artifacts-dir=extension/web-ext-artifacts-amo
          --channel=listed
          --no-input
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
