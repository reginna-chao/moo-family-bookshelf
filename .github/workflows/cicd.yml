name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── CI ──────────────────────────────────────────────
  extension-check:
    name: Extension — Typecheck, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  worker-check:
    name: Worker — Typecheck, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  pwa-check:
    name: PWA — Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter moo-family-bookshelf-pwa typecheck

      - name: Lint
        run: pnpm --filter moo-family-bookshelf-pwa lint

      - name: Test
        run: pnpm --filter moo-family-bookshelf-pwa test

      - name: Build
        run: pnpm --filter moo-family-bookshelf-pwa build

  e2e:
    name: E2E — Playwright Chrome Extension Tests
    needs: [extension-check, worker-check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            extension/pnpm-lock.yaml
            worker/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Install worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Build extension (E2E variant)
        working-directory: extension
        run: pnpm build:e2e

      - name: Typecheck E2E tests
        working-directory: extension
        run: npx tsc --noEmit --project tests/e2e/tsconfig.json

      - name: Install Playwright browsers
        working-directory: extension
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: extension
        run: xvfb-run --auto-servernum pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: extension/test-results/
          retention-days: 7

  pwa-e2e:
    name: PWA E2E — Playwright Tests
    needs: [pwa-check, worker-check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            worker/pnpm-lock.yaml

      - name: Install PWA dependencies
        run: pnpm install --frozen-lockfile

      - name: Install worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Build PWA
        working-directory: pwa
        run: pnpm build

      - name: Typecheck E2E tests
        working-directory: pwa
        run: npx tsc --noEmit --project tests/e2e/tsconfig.json

      - name: Install Playwright browsers
        working-directory: pwa
        run: npx playwright install chromium --with-deps

      - name: Run PWA E2E tests
        working-directory: pwa
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pwa-playwright-report
          path: pwa/test-results/
          retention-days: 7

  # ── CD: Dev (push to main) ─────────────────────────
  deploy-worker-dev:
    name: Deploy Worker (Dev)
    needs: [worker-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare (Dev)
        run: pnpm run deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pwa-dev:
    name: Deploy PWA (Dev)
    needs: [pwa-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build PWA (Dev)
        run: pnpm --filter moo-family-bookshelf-pwa build
        env:
          VITE_API_ENDPOINT: https://moo-family-bookshelf-dev.rcworkadd.workers.dev

      - name: Deploy to Cloudflare Pages (Dev)
        run: npx wrangler pages deploy pwa/dist --project-name=moo-family-bookshelf --branch=dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── CD: Prod (v* tag) ──────────────────────────────
  deploy-worker-prod:
    name: Deploy Worker (Prod)
    needs: [worker-check, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare (Prod)
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pwa-prod:
    name: Deploy PWA (Prod)
    needs: [pwa-check, pwa-e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build PWA (Prod)
        run: pnpm --filter moo-family-bookshelf-pwa build

      - name: Deploy to Cloudflare Pages (Prod)
        run: npx wrangler pages deploy pwa/dist --project-name=moo-family-bookshelf --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release-extension:
    name: Build Extension Release
    needs: [extension-check, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package Extension
        run: cd dist && zip -r ../../moo-family-bookshelf-${{ github.ref_name }}.zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: moo-family-bookshelf-${{ github.ref_name }}.zip
