name: Claude Code Review

on:
  pull_request:
    # Auto-review only on open / marked-ready / reopen.
    # Dropped `synchronize`: every push used to re-run a full review with no
    # cross-round memory, growing an endless tail of fresh NITPICKs. Re-review
    # after fixes is now human-triggered via `@claude` — either in the PR comment
    # box or as an inline reply under a specific review comment (both handled by
    # claude.yml). Tradeoff: a pushed CRITICAL fix is no longer auto-verified;
    # the author asks @claude to re-check (and can target the exact thread).
    types: [opened, ready_for_review, reopened]
    # Only trigger on code-directory changes; skip docs/config-only changes to save quota
    paths:
      - "extension/src/**"
      - "pwa/src/**"
      - "worker/src/**"
      - "shared/**"

# Cancel the previous in-progress review when the same PR is pushed again, to avoid duplicate spend
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip draft PRs; the real review happens on `ready_for_review`.
    if: github.event.pull_request.draft == false

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    env:
      CLAUDE_MODEL: "claude-opus-4-8"
      CLAUDE_MODEL_LABEL: "Opus 4.8"
    permissions:
      contents: read
      pull-requests: write # official default is read; raised to write so the review can post inline comments
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history is needed to diff the PR against its base branch

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Cost control + tool permissions.
          # Lesson learned: a narrow per-command Bash(...) allowlist makes Claude hit
          # a denial whenever it reaches for a command not on the list
          # (git log / cat / sed / gh pr review / TodoWrite planning...), and each
          # denial burns a turn until the run ends in error_max_turns.
          # Fix: allow the whole Bash tool + common read/planning tools to cover all
          # review-time exploration, while deliberately NOT allowing Write / Edit /
          # Task — Claude still cannot modify files, so the safety boundary holds
          # (the job is contents: read anyway).
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 35
            --allowedTools "Bash,Read,Glob,Grep,TodoWrite,mcp__github_inline_comment__create_inline_comment"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the senior code reviewer for this project. Review this pull request.

            Project conventions live in AGENTS.md and .claude/rules/*.md at the repo
            root. Read them if helpful, but if any file is unavailable, proceed using
            the diff alone — never get blocked on reading a file.

            Review ONLY the actual diff of this PR, across five dimensions:

            1. Design: single responsibility, clear layering, depend on abstractions;
               flag god functions (> ~40 lines) and mixed concerns.
            2. Readability: naming, nesting depth (max 3, prefer early return),
               no nested ternaries, file length (components < 200 lines).
            3. Performance: redundant I/O, N+1, needless recomputation; and lifecycle
               cost (setInterval / polling / background sync, per the "Lifecycle &
               Resource Cost" rules in .claude/rules/global.md).
            4. Security: auth-token validation, input validation, secret leakage, and
               KV access against the invariants in
               .claude/rules/security-ux-invariants.md.
            5. Testability: side effects isolated and injectable, pure logic separated
               from I/O, and matching tests per .claude/rules/test.md coverage targets.

            SEVERITY POLICY — align with the local Fix Cycle in
            .claude/rules/global.md (CRITICAL=must-fix / WARNING=use-judgment /
            NITPICK=optional-skippable):

            - CRITICAL — correctness bugs, security holes, or violations of the
              invariants in .claude/rules/security-ux-invariants.md. ONLY
              CRITICAL findings block the merge. Post these as inline comments.
            - WARNING — non-blocking recommendations the author may adopt at
              their discretion. Keep them few; inline comments allowed but sparse.
            - NITPICK — optional polish (anything ESLint/Prettier already covers,
              micro-naming, pure preference). Do NOT post NITPICKs as inline
              comments. Collect them into a single section titled
              "可選 NITPICK（非必要，可留待後續）", clearly marked optional and
              skippable. Do not open one inline thread per nitpick.

            VERDICT — open the summary with exactly one of these lines:
            - ✅ APPROVE — no CRITICAL findings. Say so plainly and STOP. Do not
              hunt for polish and do not manufacture NITPICKs to fill space; a
              clean PR earns a short approval, not a long list.
            - 🛑 REQUEST CHANGES — one or more CRITICAL findings; list each with
              file:line and a concrete fix.

            Do not flag formatting that ESLint/Prettier already handle. If you
            find nothing significant, give ✅ APPROVE and stop — never invent
            findings to justify the run. When a human later asks you to
            re-review after fixes, focus only on whether the prior CRITICAL items
            are resolved; do not generate a fresh batch of NITPICKs.

            The PR branch is already checked out in the current working directory.
            Use `gh pr comment` for top-level summary feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to flag specific lines in the diff.
            Only post GitHub comments — do not submit the review as a chat message.

            At the very end of the top-level summary comment, append these two lines
            exactly (substitute N with the total number of tool calls you made):

            🔧 本次審查使用工具呼叫次數：N
            🤖 Generated with [Claude Code](https://claude.com/claude-code) (${{ env.CLAUDE_MODEL_LABEL }})


            Write all review content in Traditional Chinese (繁體中文).
