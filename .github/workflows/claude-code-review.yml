name: Claude Code Review

on:
  pull_request:
    # Auto-review only on open / marked-ready / reopen.
    # Dropped `synchronize`: every push used to re-run a full review with no
    # cross-round memory, growing an endless tail of fresh NITPICKs. Re-review
    # after fixes is now human-triggered via `@claude` — either in the PR comment
    # box or as an inline reply under a specific review comment (both handled by
    # claude.yml). Tradeoff: a pushed CRITICAL fix is no longer auto-verified;
    # the author asks @claude to re-check (and can target the exact thread).
    types: [opened, ready_for_review, reopened]
    # No paths filter — every PR gets an auto-review. The old filter only
    # allowed extension/src, pwa/src, worker/src and shared, so it silently
    # skipped far more than docs: tests/, .github/, manifest.json, wrangler.toml
    # and dependency bumps (a hono security bump and a Firefox manifest fix both
    # went un-reviewed). Docs-only PRs were reviewed anyway by tagging @claude
    # (claude.yml), so the filter saved little quota and only added manual steps.

# Cancel a still-in-progress review when the same PR re-triggers within a short
# window (ready_for_review / reopened firing again, e.g. draft↔ready flips or
# close→reopen). Pushes never re-trigger this workflow — `synchronize` is
# deliberately not listened to (see the `on:` comment above).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip draft PRs; the real review happens on `ready_for_review`.
    # Skip fork PRs: a `pull_request` run from a fork receives no secrets and a
    # read-only token, so the review can never post — it would only fail and
    # leave a red X on an outside contributor's PR.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # The cost brake with teeth. Neither this workflow nor claude.yml used to set
    # one, so both inherited GitHub's 6-hour default. --max-turns is not a
    # substitute: its post-hoc comparison in the action fires only after the work
    # is already paid for (its SDK-side error_max_turns cut-off is a separate
    # mode — see the note on claude_args below). What a job timeout caps is
    # WALL CLOCK, not tokens: it stops new work, it never refunds an in-flight
    # request. At the observed burn rate (#119: $2.63 for 5m13s) a 20-minute
    # runaway still costs ~$10 — bounded at ~4x a normal review, not zero, and
    # per run, not per day. 20 minutes is ~4x the 5m25s job (checkout + setup +
    # review) that a 20-file / +2454-line PR took, so it bites only on a runaway.
    timeout-minutes: 20
    env:
      # Family alias — resolves to the latest Opus generation at run time, so the
      # repo never sits pinned on a retired snapshot. The resolved model id is
      # read from the execution log after the run and patched into the review
      # comment (see the "Fill in model footer" step below).
      CLAUDE_MODEL: "opus"
    permissions:
      contents: read
      pull-requests: write # official default is read; raised to write so the review can post inline comments
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history is needed to diff the PR against its base branch

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Tool permissions — nothing in here caps cost (see the --max-turns
          # note below, and timeout-minutes above).
          # Lesson learned: a narrow per-command Bash(...) allowlist makes Claude hit
          # a denial whenever it reaches for a command not on the list
          # (git log / cat / sed / TodoWrite planning...), and each
          # denial burns a turn until the run ends in error_max_turns.
          # Fix: allow the whole Bash tool + common read/planning tools to cover all
          # review-time exploration. Note the allowlist is NOT the safety boundary:
          # with Bash fully open, files can still be changed locally via sed -i or
          # shell redirection, so "Write/Edit not allowed" proves nothing by itself.
          # The boundary is layered, and only the first layer is hard:
          #   (a) contents: read — the job's token cannot push or merge, so
          #       `gh pr merge` fails at the API no matter how it is spelled.
          #       This is the only hard stop.
          #   (b) --disallowedTools below — blocks the obvious PR-mutating gh
          #       commands (review / merge / close) plus Write / Edit. A guardrail,
          #       NOT a boundary: the token still holds pull-requests: write, and
          #       prefix rules match command strings, so approve / close stay
          #       reachable via `gh api` or curl.
          #   (c) the prompt's explicit "comment only — never approve or merge" rule.
          #
          # --max-turns is not the cost lever it looks like; it has TWO modes.
          # (a) SDK-side (passed through as maxTurns): a real-time cut-off that
          #     ends the run as error_max_turns with NO review posted, every turn
          #     up to it still billed — the failure mode at the top of this block.
          # (b) Action-side: a post-hoc count comparison. PR #119 logged
          #     maxTurns: 35 / num_turns: 37 / is_error: false — the run completed
          #     and had already posted before the action compared and failed the
          #     job, buying only a red X on already-successful work.
          # So 100 is not a spend cap but a backstop against a pathological loop
          # spinning fast enough to stay under the job clock — NOT a PR-size knob,
          # so resist re-tuning per PR. Turn count is a poor size proxy anyway:
          # recent reviews took 16 / 20 / 21 / 31 / 37 turns on comparable PRs, so
          # 35 was approached repeatedly with ~4 turns of headroom, not breached by
          # a freak one-off.
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 100
            --allowedTools "Bash,Read,Glob,Grep,TodoWrite,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh pr close:*),Write,Edit"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the senior code reviewer for this project. Review this pull request.

            Project conventions live in AGENTS.md and .claude/rules/*.md at the repo
            root. Read them if helpful, but if any file is unavailable, proceed using
            the diff alone — never get blocked on reading a file.

            VERIFICATION SCOPE — this job deliberately does NOT install
            node_modules. lint / typecheck / test / build are owned by
            `cicd.yml`, which runs the full matrix (shared / extension / pwa /
            worker, plus both E2E suites) against this same commit. Your job is
            to review the diff by reading it.

            - Do NOT run `pnpm install`, `pnpm test`, `pnpm typecheck`,
              `pnpm lint`, or any other build tooling. Dependencies are absent,
              so those commands only fail and burn turns.
            - Do NOT add a disclaimer that you could not run them. The division
              of labour above is by design, not a gap in this run — restating it
              in the review is noise. Omit it entirely.
            - When a finding would need a build or a test run to confirm, say
              what you observed in the diff and name the check that would settle
              it. Never present it as a verified failure.

            Review ONLY the actual diff of this PR, across six dimensions:

            1. Design: single responsibility, clear layering, depend on abstractions;
               flag god functions (> ~40 lines) and mixed concerns.
            2. Readability: naming, nesting depth (max 3, prefer early return),
               no nested ternaries, file length (components < 200 lines).
            3. Performance: redundant I/O, N+1, needless recomputation; and lifecycle
               cost (setInterval / polling / background sync, per the "Lifecycle &
               Resource Cost" rules in .claude/rules/global.md).
            4. Security: auth-token validation, input validation, secret leakage, and
               KV access against the invariants in
               .claude/rules/security-ux-invariants.md.
            5. Testability: side effects isolated and injectable, pure logic separated
               from I/O, and matching tests per .claude/rules/test.md coverage targets.
            6. Docs / config-only diffs (no source files): verify factual
               accuracy against the code being described (file paths, API
               routes, KV key patterns), stale cross-references, and the
               繁體中文 requirement in .claude/rules/global.md. For CI /
               workflow diffs, also check trigger semantics, permission scope,
               and secret exposure. A docs/config diff with none of these
               problems is still a ✅ — do not reach into the five code
               dimensions to manufacture a finding.

            SEVERITY POLICY — align with the local Fix Cycle in
            .claude/rules/global.md (CRITICAL=must-fix / WARNING=use-judgment /
            NITPICK=optional-skippable):

            - CRITICAL — correctness bugs, security holes, or violations of the
              invariants in .claude/rules/security-ux-invariants.md. ONLY
              CRITICAL findings block the merge. Post these as inline comments.
            - WARNING — non-blocking recommendations the author may adopt at
              their discretion. Keep them few; inline comments allowed but sparse.
            - NITPICK — optional polish (anything ESLint/Prettier already covers,
              micro-naming, pure preference). Do NOT post NITPICKs as inline
              comments. Collect them into a single section titled
              "可選 NITPICK（非必要，可留待後續）", clearly marked optional and
              skippable. Do not open one inline thread per nitpick.

            VERDICT — open the summary with exactly one of these lines:
            - ✅ 無 CRITICAL 問題 — no CRITICAL findings. Say so plainly and STOP.
              Do not hunt for polish and do not manufacture NITPICKs to fill
              space; a clean PR earns a short verdict, not a long list.
            - 🛑 有 CRITICAL 問題 — one or more CRITICAL findings; list each with
              file:line and a concrete fix.

            Do not flag formatting that ESLint/Prettier already handle. If you
            find nothing significant, give ✅ 無 CRITICAL 問題 and stop — never
            invent findings to justify the run. When a human later asks you to
            re-review after fixes, focus only on whether the prior CRITICAL items
            are resolved; do not generate a fresh batch of NITPICKs.

            The PR branch is already checked out in the current working directory.
            Use `gh pr comment` for top-level summary feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to flag specific lines in the diff.
            Only post GitHub comments — do not submit the review as a chat message.
            你只負責留下留言，絕對不要執行 `gh pr review`、`gh pr merge`、
            `gh pr close` 等任何會改變 PR 狀態的指令；approve、合併與關閉
            一律由人類決定。

            At the very end of the top-level summary comment, append these two lines
            exactly (substitute N with the total number of tool calls you made):

            🔧 本次審查使用工具呼叫次數：N
            <!-- MODEL_FOOTER -->

            The second line is a literal HTML comment marker. Output
            <!-- MODEL_FOOTER --> exactly as written — do NOT rewrite, translate,
            or drop it. The workflow replaces it with the actual model info after
            the run.

            Write all review content in Traditional Chinese (繁體中文).

      - name: Fill in model footer
        # Replaces the <!-- MODEL_FOOTER --> marker in the review summary comment
        # with the model id the run actually resolved to (read from the execution
        # log), so the footer always shows the real Opus version behind the alias.
        # Cosmetic backfill: a failure here (gh 5xx, rate limit, jq surprise) must
        # not turn an already-posted successful review red.
        #
        # Deliberately runs even when the review step went red: an overrun posts
        # the review in full and only then fails, so gating on success dropped the
        # footer exactly when it was still needed (PR #119 kept a raw
        # <!-- MODEL_FOOTER --> marker for this reason). The condition MUST contain
        # a status check function — GitHub implicitly ANDs success() onto any if:
        # that lacks one, so merely loosening the `conclusion` comparison would
        # still skip the step. !cancelled() (house style, see cicd.yml) rather than
        # always(), so a cancelled workflow stays cancelled; execution_file is the
        # real precondition, and the script below no-ops when no marker is found.
        continue-on-error: true
        if: ${{ !cancelled() && steps.claude-review.outputs.execution_file != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXEC_FILE: ${{ steps.claude-review.outputs.execution_file }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- MODEL_FOOTER -->'

          # ---- 1. Resolve the model id actually used ----
          MODEL_ID="unknown"
          if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            # TODO(first-run): debug dump to confirm the execution log's JSON
            # shape. The extraction below tries both known candidate paths — a
            # nested .message.model (assistant entries, preferred: always the
            # concrete resolved id) and a top-level .model (system/init entry).
            # startswith("claude-") skips an echoed alias ("opus") and the
            # "<synthetic>" model on synthetic entries. After the first
            # successful run, check which path matched, trim the dead path, and
            # delete this debug block.
            echo "::group::execution_file debug — first 3 entries (type + keys)"
            jq -c 'if type == "array"
                   then .[:3] | map({type: (.type? // null), keys: (keys? // [])})
                   else {type: type, keys: (keys? // [])} end' "$EXEC_FILE" || true
            echo "::endgroup::"

            MODEL_ID=$(jq -r '
              [ .[]?
                | (.message?.model? // .model?)
                | select(type == "string" and startswith("claude-"))
              ] | first // "unknown"' "$EXEC_FILE") || MODEL_ID="unknown"
          else
            echo "execution_file missing or not set; using model id 'unknown'"
          fi
          echo "Resolved model id: $MODEL_ID"

          # ---- 2. Find the PR comment carrying the marker ----
          # Bot-authored comments only: a human quoting the marker in discussion
          # must never become the patch target. (.body // "") guards null bodies.
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq ".[] | select(.user.type == \"Bot\") | select((.body // \"\") | contains(\"$MARKER\")) | .id" \
            | tail -n 1)
          if [ -z "$COMMENT_ID" ]; then
            echo "No PR comment contains $MARKER; nothing to update."
            exit 0
          fi

          # ---- 3. Swap the marker for the footer line ----
          # The body must travel via files (-F body=@file), never shell string
          # interpolation — review bodies contain backticks and code fences.
          gh api "repos/$REPO/issues/comments/$COMMENT_ID" --jq .body > "$RUNNER_TEMP/body_old.md"
          jq -Rrs --arg marker "$MARKER" \
                  --arg repl "🤖 Generated with Claude Code — 模型：\`$MODEL_ID\`" \
                  'split($marker) | join($repl) | rtrimstr("\n")' \
                  "$RUNNER_TEMP/body_old.md" > "$RUNNER_TEMP/body_new.md"
          gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" \
            -F body=@"$RUNNER_TEMP/body_new.md" > /dev/null
          echo "Comment $COMMENT_ID updated with model id: $MODEL_ID"
