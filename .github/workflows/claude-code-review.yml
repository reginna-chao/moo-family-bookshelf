name: Claude Code Review

on:
  pull_request:
    # 官方原有：opened, synchronize, ready_for_review, reopened
    types: [opened, synchronize, ready_for_review, reopened]
    # 只在「程式碼目錄」變動時觸發，過濾掉文件 / 設定檔變更以節省額度
    # TODO 暫時隱藏，先修正錯誤確認整個流程可以跑
    # paths:
    #   - "extension/src/**"
    #   - "pwa/src/**"
    #   - "worker/src/**"
    #   - "shared/**"

# 同一個 PR 連續推送時，取消前一個未完成的審查，避免重複消耗額度
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # 官方為 read；改為 write 以支援貼 inline review comment
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 需要完整歷史才能正確 diff PR 與 base 分支

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # 成本控制 + 工具授權。
          # allowedTools 必須同時包含：
          #   - 讀檔工具 (Read/Glob/Grep)：prompt 會參照 AGENTS.md 與 .claude/rules/*.md
          #   - GitHub 留言工具：才能貼 inline comment 與總結留言
          # 任何 Claude 需要、卻沒列在這裡的工具都會被拒並燒掉一個 turn。
          # NOTE: 流程驗證 OK 後，把 --model 改回 claude-opus-4-8。
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the senior code reviewer for this project. Review this pull request.

            Project conventions live in AGENTS.md and .claude/rules/*.md at the repo
            root. Read them if helpful, but if any file is unavailable, proceed using
            the diff alone — never get blocked on reading a file.

            Review ONLY the actual diff of this PR, across five dimensions:

            1. Design: single responsibility, clear layering, depend on abstractions;
               flag god functions (> ~40 lines) and mixed concerns.
            2. Readability: naming, nesting depth (max 3, prefer early return),
               no nested ternaries, file length (components < 200 lines).
            3. Performance: redundant I/O, N+1, needless recomputation; and lifecycle
               cost (setInterval / polling / background sync, per the "Lifecycle &
               Resource Cost" rules in .claude/rules/global.md).
            4. Security: auth-token validation, input validation, secret leakage, and
               KV access against the invariants in
               .claude/rules/security-ux-invariants.md.
            5. Testability: side effects isolated and injectable, pure logic separated
               from I/O, and matching tests per .claude/rules/test.md coverage targets.

            Tag each finding CRITICAL / WARNING / NITPICK. In the top-level summary,
            state whether any CRITICAL finding should block the merge. If you find
            nothing significant, say so plainly — do not invent findings.

            The PR branch is already checked out in the current working directory.
            Use `gh pr comment` for top-level summary feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to flag specific lines in the diff.
            Only post GitHub comments — do not submit the review as a chat message.

            Write all review content in Traditional Chinese (繁體中文).
