name: Claude Code

on:
  # Listen to the main comment box, issues, AND inline code-review comment replies.
  # pull_request_review_comment lets @claude be tagged inside an inline review-comment
  # reply (not just the PR/Issue main comment box).
  # Note: pull_request_review (the review-submit event) is intentionally NOT listened
  # to, because the auto-review bot submitting a review would wake the workflow on
  # every PR. The sender.type != 'Bot' guard below filters out the remaining bot-driven
  # inline-comment noise, so only a human tagging @claude actually runs the job.
  # Tradeoff: a human posting an inline reply without "@claude" still creates a quick
  # skipped run, since GitHub creates the run before evaluating the job-level if.
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # sender.type != 'Bot': skip immediately when a comment is posted by a bot
    # (including the review bot's own summary), so no bot comment ever wakes Claude.
    # Only a human tagging @claude in the main comment box actually runs it.
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Response-format guidance for GitHub comments: when Claude proposes a code
          # change, it must write the actual code inline in the comment as a fenced code
          # block, NOT hand the reader a "Fix this ->" claude.ai/code deep link. Steered
          # via --append-system-prompt so the comment-driven task itself is untouched.
          # (No literal backticks in the value — they would be shell-interpreted when the
          # action forwards claude_args; the intent is spelled out in words instead.)
          claude_args: >-
            --append-system-prompt "When you propose a code change in a GitHub PR or
            issue comment, write the actual suggested code directly in the comment inside
            a fenced Markdown code block (triple-backtick with a language tag), and note
            the target file path and line just above it. Do NOT replace the suggestion
            with a 'Fix this' link to claude.ai/code or any other external redirect; the
            reviewable code must live in the comment itself. Prefer a GitHub suggestion
            block (a fenced block whose info string is the single word suggestion) when
            the edit is a small contiguous change to an existing file, so the author can
            commit it with one click."

