name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  extension-check:
    name: Extension — Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  worker-check:
    name: Worker — Lint, Typecheck, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  pwa-check:
    name: PWA — Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter moo-family-bookshelf-pwa typecheck

      - name: Lint
        run: pnpm --filter moo-family-bookshelf-pwa lint

      - name: Test
        run: pnpm --filter moo-family-bookshelf-pwa test

      - name: Build
        run: pnpm --filter moo-family-bookshelf-pwa build

  e2e:
    name: E2E — Playwright Chrome Extension Tests
    needs: [extension-check, worker-check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            extension/pnpm-lock.yaml
            worker/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Install worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Build extension (E2E variant)
        working-directory: extension
        run: pnpm build:e2e

      - name: Typecheck E2E tests
        working-directory: extension
        run: npx tsc --noEmit --project tests/e2e/tsconfig.json

      - name: Install Playwright browsers
        working-directory: extension
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: extension
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: extension/test-results/
          retention-days: 7

  pwa-e2e:
    name: PWA E2E — Playwright Tests
    needs: [pwa-check, worker-check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            worker/pnpm-lock.yaml

      - name: Install PWA dependencies
        run: pnpm install --frozen-lockfile

      - name: Install worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Typecheck E2E tests
        working-directory: pwa
        run: npx tsc --noEmit --project tests/e2e/tsconfig.json

      - name: Install Playwright browsers
        working-directory: pwa
        run: npx playwright install chromium --with-deps

      - name: Run PWA E2E tests
        working-directory: pwa
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pwa-playwright-report
          path: pwa/test-results/
          retention-days: 7
