<svg viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MooFamily Bookshelf — Chrome Web Store Marquee Promo (1400x560)</title>
  <rect width="1400" height="560" fill="#F5EDE3"/>

