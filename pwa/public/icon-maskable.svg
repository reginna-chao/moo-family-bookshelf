<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: full bleed background, content within safe zone (center 80%) -->
  <rect width="512" height="512" fill="#2563eb"/>
  <g transform="translate(128, 116) scale(0.5)" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bookshelf: two vertical sides -->
    <line x1="20" y1="0" x2="20" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <!-- Shelf lines -->
    <line x1="20" y1="170" x2="300" y2="170"/>
    <line x1="20" y1="340" x2="300" y2="340"/>
    <!-- Books on top shelf -->
    <rect x="50" y="40" width="30" height="130" rx="4" fill="#ffffff" stroke="none"/>
    <rect x="90" y="60" width="30" height="110" rx="4" fill="#93c5fd" stroke="none"/>
    <rect x="130" y="30" width="35" height="140" rx="4" fill="#ffffff" stroke="none"/>
    <rect x="175" y="50" width="28" height="120" rx="4" fill="#bfdbfe" stroke="none"/>
    <rect x="213" y="45" width="32" height="125" rx="4" fill="#ffffff" stroke="none"/>
    <rect x="255" y="65" width="25" height="105" rx="4" fill="#93c5fd" stroke="none"/>
    <!-- Books on bottom shelf -->
    <rect x="45" y="200" width="35" height="140" rx="4" fill="#bfdbfe" stroke="none"/>
    <rect x="90" y="220" width="30" height="120" rx="4" fill="#ffffff" stroke="none"/>
    <rect x="130" y="210" width="32" height="130" rx="4" fill="#93c5fd" stroke="none"/>
    <rect x="172" y="195" width="28" height="145" rx="4" fill="#ffffff" stroke="none"/>
    <!-- Heart -->
    <g transform="translate(220, 240) scale(0.7)" fill="#f87171" stroke="none">
      <path d="M50 20 C50 0, 90 0, 90 20 C90 50, 50 70, 50 70 C50 70, 10 50, 10 20 C10 0, 50 0, 50 20Z"/>
    </g>
  </g>
</svg>
