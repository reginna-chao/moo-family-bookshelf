name = "moo-family-bookshelf-backup"
main = "src/backup/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Kept disabled: deploy-worker-prod fills the placeholders and enables it; a local copy (wrangler.backup.local.toml) serves pnpm backup:drill and manual ops.
# Deployed by CD on `v*` tags, before (and separately from) the application Worker.
# The two Healthchecks UUIDs are secrets, never vars:
#   wrangler secret put HEALTHCHECKS_UUID / HEALTHCHECKS_CAPACITY_UUID
[vars]
BACKUP_ENABLED = "false"
SOURCE_ACCOUNT_ID = "YOUR_CLOUDFLARE_ACCOUNT_ID"
SOURCE_NAMESPACE_ID = "YOUR_PROD_KV_NAMESPACE_ID"
# Read only by `pnpm backup:drill` (the Worker ignores it): an EMPTY isolated
# namespace in the same account, never the source.
RESTORE_DRILL_NAMESPACE_ID = "YOUR_EMPTY_DRILL_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "BACKUP_KV"
id = "YOUR_PROD_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "moo-family-bookshelf-backups"

[triggers]
# Keep empty here: deploy-worker-prod sets it to ["17 3 * * *"] on `v*` tags.
crons = []

[observability]
enabled = true
head_sampling_rate = 1
