name = "moo-family-bookshelf-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"

# Workers Observability (free tier: 200k log events/day, 3-day retention)
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
# Invocation logs record every request URL, and /api paths carry the sync code, userIds and share tokens.
invocation_logs = false

# Dev environment KV (default for wrangler dev / wrangler deploy)
# Replace with your own KV namespace ID (see worker/DEPLOY.md)
[[kv_namespaces]]
binding = "KV"
# KV namespace used after deployment (wrangler deploy)
id = "YOUR_DEV_KV_NAMESPACE_ID"
# KV namespace used during local development (wrangler dev --remote)
preview_id = "YOUR_DEV_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# Native Rate Limiting bindings — per-minute limits only. The verification
# gate's two hourly attempt budgets live in the ATTEMPT_BUDGET Durable Object
# below; every other hourly counter stays on KV. One binding per distinct
# limit: several counters share a binding
# and stay isolated by the key the Worker passes to limit(). Mapping lives in
# src/middleware/rateLimit.ts (BINDING_BY_LIMIT).
#
# Declared as the official `[[ratelimits]]` blocks, which need wrangler 4 (the
# devDependency in package.json). Wrangler 3 only WARNS (`Unexpected fields
# found in top-level field: "ratelimits"`) and deploys the Worker WITHOUT the
# bindings — it still runs, on the KV counters, logging
# RATE_LIMIT_BINDING_MISSING on every per-minute check. A self-hoster still on
# wrangler 3 must either upgrade (`pnpm install` in this repo does it) or
# re-spell each block as `[[unsafe.bindings]]` with an extra
# `type = "ratelimit"` line.
#
# Self-hosters: namespace_id values are YOURS to choose — any positive integer,
# unique within your own Cloudflare account. Dev and production must not share
# one, or the two Workers count into the same namespace. Without these blocks
# the Worker still runs, on the previous KV counters (see worker/DEPLOY.md).
# ---------------------------------------------------------------------------

# 60/min — per-IP standard tier + per-userId "borrow-list"
[[ratelimits]]
name = "RATE_LIMIT_60_PER_MIN"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# 30/min — per-userId "bookshelf" + "borrow-update"
[[ratelimits]]
name = "RATE_LIMIT_30_PER_MIN"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# 10/min — per-IP public tier + per-userId "borrow-create"
[[ratelimits]]
name = "RATE_LIMIT_10_PER_MIN"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# 3/min — per-IP sensitive tier, both buckets (onboarding + auth lookup)
[[ratelimits]]
name = "RATE_LIMIT_3_PER_MIN"
namespace_id = "1004"
simple = { limit = 3, period = 60 }

# ---------------------------------------------------------------------------
# Verification attempt budgets (src/durable/attemptBudgetObject.ts): one
# Durable Object per hourly budget, so parallel requests cannot exceed it.
# SQLite-backed, which the Workers Free plan allows; `wrangler deploy` applies
# the migration. Once deployed, the Worker cannot go back to a version without
# this class — to pause it, remove only the binding (worker/DEPLOY.md).
# Without the binding the Worker still runs: those budgets fall back to the
# KV counters and log ATTEMPT_BUDGET_BINDING_MISSING.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "ATTEMPT_BUDGET"
class_name = "AttemptBudgetObject"

# Inherited by [env.production]; never repeat it there.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AttemptBudgetObject"]

# Production environment
[env.production]
name = "moo-family-bookshelf"

[env.production.observability]
enabled = true
head_sampling_rate = 1

# This block replaces the top-level [observability], so invocation logs are disabled here too.
[env.production.observability.logs]
invocation_logs = false

# Finishes interrupted account deletions and removes data written back after one
# (src/services/accountDeletionSweep.ts). Production only: KV list operations are
# shared across the Cloudflare account, and a dev cron would double the daily count.
# Self-hosters: see worker/DEPLOY.md.
[env.production.triggers]
crons = ["*/30 * * * *"]

# Replace with your own KV namespace ID (see worker/DEPLOY.md)
[[env.production.kv_namespaces]]
binding = "KV"
id = "YOUR_PROD_KV_NAMESPACE_ID"

# Rate limiting bindings, repeated for production: environments do NOT inherit
# top-level bindings, so omitting these would deploy the production Worker
# without them — it would fall back to the KV counters and log
# RATE_LIMIT_BINDING_MISSING on every request. Separate namespace_id range
# (2xxx) so dev traffic cannot consume production's budget.

# 60/min — per-IP standard tier + per-userId "borrow-list"
[[env.production.ratelimits]]
name = "RATE_LIMIT_60_PER_MIN"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

# 30/min — per-userId "bookshelf" + "borrow-update"
[[env.production.ratelimits]]
name = "RATE_LIMIT_30_PER_MIN"
namespace_id = "2002"
simple = { limit = 30, period = 60 }

# 10/min — per-IP public tier + per-userId "borrow-create"
[[env.production.ratelimits]]
name = "RATE_LIMIT_10_PER_MIN"
namespace_id = "2003"
simple = { limit = 10, period = 60 }

# 3/min — per-IP sensitive tier, both buckets (onboarding + auth lookup)
[[env.production.ratelimits]]
name = "RATE_LIMIT_3_PER_MIN"
namespace_id = "2004"
simple = { limit = 3, period = 60 }

# Durable Object binding, repeated for production: environments do NOT inherit
# it (the [[migrations]] above they do). Omitting it puts the production
# verification budgets back on the KV counters.
[[env.production.durable_objects.bindings]]
name = "ATTEMPT_BUDGET"
class_name = "AttemptBudgetObject"

# DEV_MODE is NOT set in production.
# For local dev, create .dev.vars with DEV_MODE=1 to enable localhost CORS.
# See: https://developers.cloudflare.com/workers/configuration/environment-variables/
# VERIFY_PEPPER (PIN / pattern hash key) is a secret: `wrangler secret put VERIFY_PEPPER`
# (add `--env production` for the production Worker). Never put it in this file. See DEPLOY.md.
