<title>問題回報</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    color: #1e293b;
    background: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;
  }
  p { margin: 8px 0; line-height: 1.6; }

<body>
<main>
  <p>正在前往問題回報頁…</p>
  <noscript>
    <p>此頁需要 JavaScript 才能依參數跳轉。</p>
    <p><a href="https://github.com/reginna-chao/moo-family-bookshelf/issues">點此前往問題回報頁</a></p>
  </noscript>
</main>
<script>
(function () {
  var DEFAULT = 'https://github.com/reginna-chao/moo-family-bookshelf/issues';
  var DESTINATIONS = {
    plurk: 'https://www.plurk.com/p/3gyz74peep'
  };
  var params = new URLSearchParams(window.location.search);
  var platform = params.get('platform');
  var target = (platform && Object.prototype.hasOwnProperty.call(DESTINATIONS, platform))
    ? DESTINATIONS[platform]
    : DEFAULT;
  window.location.replace(target);
})();
</script>
</body>
