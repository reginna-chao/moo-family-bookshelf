<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="refresh"
      content="0;url=https://github.com/reginna-chao/moo-family-bookshelf/issues"
    />
    <title>問題回報</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC",
          sans-serif;
        color: #1e293b;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      p {
        margin: 8px 0;
        line-height: 1.6;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <p>正在前往問題回報頁…</p>
      <noscript>
        <p>此頁需要 JavaScript 才能依參數跳轉。</p>
        <p>
          <a href="https://github.com/reginna-chao/moo-family-bookshelf/issues"
            >點此前往問題回報頁</a
          >
        </p>
      </noscript>
    </main>
    <script>
      (function () {
        var DEFAULT =
          "https://github.com/reginna-chao/moo-family-bookshelf/issues";
        var params = new URLSearchParams(window.location.search);
        var platform = params.get("platform");

        var GOOGLE_FORM_SHORT = "https://forms.gle/ZZHzxBh6EV2A8hMUA";
        var GOOGLE_FORM_VIEWFORM =
          "https://docs.google.com/forms/d/e/1FAIpQLSfKoAOkIvZfGU0vZie2zIQj0LjCv2RcYpj6pJjRMnYzQohTWg/viewform";
        var GOOGLE_FORM_VERSION_ENTRY = "entry.1575026440";
        // The form's 問題類型 field; `topic=recovery` prefills it with the value below.
        var GOOGLE_FORM_TOPIC_ENTRY = "entry.180534969";
        var GOOGLE_FORM_TOPIC_RECOVERY_VALUE = "忘記登入驗證方式";

        function buildGoogleFormUrl() {
          if (!GOOGLE_FORM_VIEWFORM) return GOOGLE_FORM_SHORT;
          var prefills = [];
          var v = params.get("v");
          if (GOOGLE_FORM_VERSION_ENTRY && v) {
            prefills.push(
              GOOGLE_FORM_VERSION_ENTRY + "=" + encodeURIComponent(v),
            );
          }
          if (GOOGLE_FORM_TOPIC_ENTRY && params.get("topic") === "recovery") {
            prefills.push(
              GOOGLE_FORM_TOPIC_ENTRY +
                "=" +
                encodeURIComponent(GOOGLE_FORM_TOPIC_RECOVERY_VALUE),
            );
          }
          if (prefills.length === 0) return GOOGLE_FORM_VIEWFORM;
          return GOOGLE_FORM_VIEWFORM + "?usp=pp_url&" + prefills.join("&");
        }

        var DESTINATIONS = {
          plurk: function () {
            return "https://www.plurk.com/p/3gyz74peep";
          },
          googleform: buildGoogleFormUrl,
        };

        var resolver =
          platform &&
          Object.prototype.hasOwnProperty.call(DESTINATIONS, platform)
            ? DESTINATIONS[platform]
            : null;
        var target = resolver ? resolver() : DEFAULT;
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
