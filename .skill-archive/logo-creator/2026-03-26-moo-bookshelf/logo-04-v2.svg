<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MooFamily Bookshelf — Window Bookshelf v2 (leaning books, bookmark)</title>
  <!-- Refinement: Books with varied angles, bookmark ribbon, more personality -->
  <rect width="512" height="512" rx="64" fill="#F5EDE3"/>
  <!-- Arch window frame -->
  <path d="M146,400 L146,210 Q146,110 256,110 Q366,110 366,210 L366,400Z" fill="#6B4C3B"/>
  <!-- Inner window -->
  <path d="M164,400 L164,218 Q164,130 256,130 Q348,130 348,218 L348,400Z" fill="#FBF7F2"/>
  <!-- Warm glow from top -->
  <ellipse cx="256" cy="168" rx="50" ry="30" fill="#F5D4A0" opacity="0.3"/>
  <!-- Upper shelf -->
  <rect x="164" y="275" width="184" height="10" rx="1" fill="#A67B5B"/>
  <!-- Books on upper shelf - some leaning -->
  <rect x="180" y="200" width="24" height="75" rx="3" fill="#D4836A"/>
  <rect x="208" y="205" width="20" height="70" rx="3" fill="#C4956A" transform="rotate(-3, 218, 240)"/>
  <rect x="232" y="198" width="24" height="77" rx="3" fill="#D4A574"/>
  <!-- Bookmark ribbon -->
  <path d="M270,195 L270,170 L278,180 L286,170 L286,195" fill="#D4836A" opacity="0.8"/>
  <rect x="260" y="195" width="26" height="80" rx="3" fill="#B8906A"/>
  <rect x="290" y="210" width="20" height="65" rx="3" fill="#E8C9A8" transform="rotate(4, 300, 242)"/>
  <rect x="314" y="205" width="22" height="70" rx="3" fill="#C4956A"/>
  <!-- Lower shelf -->
  <rect x="164" y="370" width="184" height="10" rx="1" fill="#A67B5B"/>
  <!-- Books on lower shelf -->
  <rect x="180" y="295" width="28" height="75" rx="3" fill="#E8C9A8"/>
  <rect x="212" y="305" width="22" height="65" rx="3" fill="#D4836A" transform="rotate(-2, 223, 337)"/>
  <rect x="238" y="292" width="24" height="78" rx="3" fill="#B8906A"/>
  <rect x="266" y="300" width="22" height="70" rx="3" fill="#D4A574"/>
  <!-- One book lying flat on lower shelf -->
  <rect x="292" y="355" width="45" height="15" rx="2" fill="#C4956A"/>
  <rect x="292" y="340" width="45" height="15" rx="2" fill="#D4836A"/>
  <!-- Text -->
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="600" fill="#6B4C3B" letter-spacing="1">MooFamily</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#A68B7B" letter-spacing="3">BOOKSHELF</text>
</svg>