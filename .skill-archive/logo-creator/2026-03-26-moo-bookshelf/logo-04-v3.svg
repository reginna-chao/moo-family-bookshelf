<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MooFamily Bookshelf — Window Bookshelf v3 (dark frame, plant accent)</title>
  <!-- Refinement: Darker richer frame, small plant on shelf, cozier mood -->
  <rect width="512" height="512" rx="64" fill="#F5EDE3"/>
  <!-- Arch window frame (darker, richer) -->
  <path d="M146,400 L146,210 Q146,110 256,110 Q366,110 366,210 L366,400Z" fill="#4A3728"/>
  <!-- Inner window -->
  <path d="M166,400 L166,220 Q166,134 256,134 Q346,134 346,220 L346,400Z" fill="#FBF7F2"/>
  <!-- Warm ambient glow -->
  <ellipse cx="256" cy="172" rx="48" ry="28" fill="#F5D4A0" opacity="0.3"/>
  <!-- Upper shelf -->
  <rect x="166" y="272" width="180" height="10" rx="1" fill="#8B6F5E"/>
  <!-- Books on upper shelf -->
  <rect x="178" y="200" width="22" height="72" rx="3" fill="#D4836A"/>
  <rect x="204" y="208" width="20" height="64" rx="3" fill="#C4956A"/>
  <rect x="228" y="195" width="24" height="77" rx="3" fill="#D4A574"/>
  <rect x="256" y="205" width="22" height="67" rx="3" fill="#B8906A"/>
  <rect x="282" y="198" width="20" height="74" rx="3" fill="#E8C9A8"/>
  <rect x="306" y="210" width="24" height="62" rx="3" fill="#C4956A"/>
  <!-- Small plant on upper shelf -->
  <g transform="translate(336, 268)">
    <rect x="-5" y="-8" width="10" height="8" rx="2" fill="#A67B5B"/>
    <ellipse cx="0" cy="-14" rx="8" ry="7" fill="#8B9E6B" opacity="0.8"/>
    <ellipse cx="-5" cy="-18" rx="5" ry="5" fill="#8B9E6B" opacity="0.6"/>
    <ellipse cx="5" cy="-17" rx="5" ry="5" fill="#9BAF7B" opacity="0.7"/>
  </g>
  <!-- Lower shelf -->
  <rect x="166" y="365" width="180" height="10" rx="1" fill="#8B6F5E"/>
  <!-- Books on lower shelf -->
  <rect x="178" y="290" width="26" height="75" rx="3" fill="#E8C9A8"/>
  <rect x="208" y="298" width="22" height="67" rx="3" fill="#D4836A"/>
  <rect x="234" y="285" width="24" height="80" rx="3" fill="#B8906A"/>
  <rect x="262" y="295" width="22" height="70" rx="3" fill="#D4A574"/>
  <rect x="288" y="288" width="24" height="77" rx="3" fill="#C4956A"/>
  <rect x="316" y="300" width="20" height="65" rx="3" fill="#E8C9A8"/>
  <!-- Text -->
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="600" fill="#4A3728" letter-spacing="1">MooFamily</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#8B7B6B" letter-spacing="3">BOOKSHELF</text>
</svg>