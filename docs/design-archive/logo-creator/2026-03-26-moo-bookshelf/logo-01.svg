<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MooFamily Bookshelf — Open Book House</title>
  <!-- Concept: An open book forming a house/home roof shape, symbolizing family + books -->
  <rect width="512" height="512" rx="64" fill="#F5EDE3"/>
  <!-- House roof / open book shape -->
  <g transform="translate(256, 240)">
    <!-- Left page -->
    <path d="M-8,-80 L-8,-20 Q-8,0 -28,5 L-120,30 Q-130,33 -130,23 L-130,-50 Q-130,-60 -120,-63 L-28,-88 Q-8,-95 -8,-80Z" fill="#C4956A"/>
    <!-- Right page -->
    <path d="M8,-80 L8,-20 Q8,0 28,5 L120,30 Q130,33 130,23 L130,-50 Q130,-60 120,-63 L28,-88 Q8,-95 8,-80Z" fill="#D4A574"/>
    <!-- Spine line -->
    <line x1="0" y1="-90" x2="0" y2="10" stroke="#A67B5B" stroke-width="4" stroke-linecap="round"/>
    <!-- Page lines left -->
    <line x1="-30" y1="-60" x2="-100" y2="-38" stroke="#E8D5C0" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="-42" x2="-100" y2="-20" stroke="#E8D5C0" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="-24" x2="-100" y2="-2" stroke="#E8D5C0" stroke-width="3" stroke-linecap="round"/>
    <!-- Page lines right -->
    <line x1="30" y1="-60" x2="100" y2="-38" stroke="#EEE0D0" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="-42" x2="100" y2="-20" stroke="#EEE0D0" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="-24" x2="100" y2="-2" stroke="#EEE0D0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Small heart above book -->
  <path d="M256,130 L248,138 Q236,148 256,165 Q276,148 264,138Z" fill="#D4836A" opacity="0.7"/>
  <!-- Text -->
  <text x="256" y="370" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="600" fill="#6B4C3B" letter-spacing="2">MooFamily</text>
  <text x="256" y="405" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#A68B7B" letter-spacing="4">BOOKSHELF</text>
</svg>