<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MooFamily Bookshelf — Geometric Book</title>
  <!-- Concept: Ultra-minimalist geometric open book with a warm gradient -->
  <defs>
    <linearGradient id="g05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#g05)"/>
  <g transform="translate(256, 240)">
    <!-- Open book - left page -->
    <path d="M-6,-70 L-6,40 L-110,65 L-110,-40Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Open book - right page -->
    <path d="M6,-70 L6,40 L110,65 L110,-40Z" fill="#FFFFFF" opacity="0.85"/>
    <!-- Spine -->
    <rect x="-6" y="-70" width="12" height="110" rx="2" fill="#FFFFFF" opacity="0.4"/>
    <!-- Minimal text lines on left page -->
    <line x1="-20" y1="-40" x2="-90" y2="-26" stroke="#D4A574" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="-20" y1="-20" x2="-90" y2="-6" stroke="#D4A574" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="-20" y1="0" x2="-70" y2="10" stroke="#D4A574" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
  </g>
  <!-- Text -->
  <text x="256" y="375" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="2" opacity="0.95">MooFamily</text>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="300" fill="#FFFFFF" letter-spacing="5" opacity="0.8">BOOKSHELF</text>
</svg>