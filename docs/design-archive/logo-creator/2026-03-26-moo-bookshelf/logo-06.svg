<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MooFamily Bookshelf — Circle Shelf</title>
  <!-- Concept: Books arranged in a circle, representing family sharing -->
  <rect width="512" height="512" rx="64" fill="#FAF6F1"/>
  <!-- Outer circle frame -->
  <circle cx="256" cy="235" r="130" fill="none" stroke="#6B4C3B" stroke-width="6"/>
  <!-- Books arranged radially inside circle -->
  <g transform="translate(256, 235)">
    <!-- Book 1 - top left -->
    <rect x="-65" y="-85" width="22" height="55" rx="3" fill="#D4836A" transform="rotate(-20, -54, -57)"/>
    <!-- Book 2 - top -->
    <rect x="-12" y="-95" width="24" height="55" rx="3" fill="#C4956A"/>
    <!-- Book 3 - top right -->
    <rect x="43" y="-85" width="22" height="55" rx="3" fill="#D4A574" transform="rotate(20, 54, -57)"/>
    <!-- Book 4 - right -->
    <rect x="70" y="-20" width="22" height="55" rx="3" fill="#E8C9A8" transform="rotate(70, 81, 7)"/>
    <!-- Book 5 - bottom right -->
    <rect x="30" y="40" width="22" height="50" rx="3" fill="#B8906A" transform="rotate(140, 41, 65)"/>
    <!-- Book 6 - bottom -->
    <rect x="-12" y="45" width="24" height="55" rx="3" fill="#C4956A" transform="rotate(180, 0, 72)"/>
    <!-- Book 7 - bottom left -->
    <rect x="-52" y="40" width="22" height="50" rx="3" fill="#D4836A" transform="rotate(-140, -41, 65)"/>
    <!-- Book 8 - left -->
    <rect x="-92" y="-20" width="22" height="55" rx="3" fill="#D4A574" transform="rotate(-70, -81, 7)"/>
    <!-- Center heart/sharing symbol -->
    <path d="M0,-12 C-5,-22 -18,-22 -18,-10 C-18,0 0,15 0,15 C0,15 18,0 18,-10 C18,-22 5,-22 0,-12Z" fill="#D4836A" opacity="0.6"/>
  </g>
  <!-- Text -->
  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="600" fill="#6B4C3B" letter-spacing="2">MooFamily</text>
  <text x="256" y="443" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="400" fill="#A68B7B" letter-spacing="4">BOOKSHELF</text>
</svg>