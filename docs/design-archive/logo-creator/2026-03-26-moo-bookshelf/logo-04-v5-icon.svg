<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MooFamily Bookshelf Icon — Single Shelf</title>
  <!-- Simplified: one shelf, fewer books, bolder shapes for small size legibility -->
  <rect width="512" height="512" rx="64" fill="#F5EDE3"/>
  <!-- Arch window frame (thicker for small sizes) -->
  <path d="M100,420 L100,230 Q100,80 256,80 Q412,80 412,230 L412,420Z" fill="#6B4C3B"/>
  <!-- Inner window -->
  <path d="M130,420 L130,245 Q130,112 256,112 Q382,112 382,245 L382,420Z" fill="#FBF7F2"/>
  <!-- Warm glow -->
  <ellipse cx="256" cy="190" rx="70" ry="45" fill="#F5D4A0" opacity="0.25"/>
  <!-- Single shelf -->
  <rect x="130" y="340" width="252" height="14" rx="2" fill="#A67B5B"/>
  <!-- Books on shelf — fewer, bolder, wider -->
  <rect x="152" y="195" width="38" height="145" rx="5" fill="#D4836A"/>
  <rect x="196" y="215" width="34" height="125" rx="5" fill="#C4956A"/>
  <rect x="236" y="200" width="36" height="140" rx="5" fill="#D4A574"/>
  <rect x="278" y="210" width="38" height="130" rx="5" fill="#B8906A"/>
  <rect x="322" y="198" width="34" height="142" rx="5" fill="#E8C9A8"/>
  <!-- Plant on shelf -->
  <g transform="translate(372, 334)">
    <rect x="-8" y="-12" width="16" height="12" rx="3" fill="#A67B5B"/>
    <ellipse cx="0" cy="-22" rx="12" ry="11" fill="#8B9E6B" opacity="0.8"/>
    <ellipse cx="-8" cy="-28" rx="8" ry="7" fill="#8B9E6B" opacity="0.6"/>
    <ellipse cx="8" cy="-27" rx="8" ry="7" fill="#9BAF7B" opacity="0.7"/>
  </g>
</svg>