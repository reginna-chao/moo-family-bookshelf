<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MooFamily Bookshelf — OG Image</title>
  <!-- Layout: Left text + Right bookshelf icon -->
  <rect width="1200" height="630" fill="#F5EDE3"/>
  <!-- Subtle dot pattern -->
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.2" fill="#D4A574" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Left side: text content -->
  <text x="120" y="250" font-family="sans-serif" font-size="64" font-weight="700" fill="#6B4C3B">MooFamily</text>
  <text x="120" y="320" font-family="sans-serif" font-size="64" font-weight="700" fill="#6B4C3B">Bookshelf</text>
  <text x="120" y="380" font-family="sans-serif" font-size="28" font-weight="400" fill="#A68B7B">與家人分享你的書架</text>
  <!-- Accent line -->
  <rect x="120" y="410" width="80" height="4" rx="2" fill="#D4836A"/>
  <!-- Right side: bookshelf icon (scaled from logo) -->
  <g transform="translate(880, 315) scale(0.55)">
    <!-- Arch window frame -->
    <path d="M-148,176 L-148,-34 Q-148,-164 0,-164 Q148,-164 148,-34 L148,176Z" fill="#6B4C3B"/>
    <!-- Inner window -->
    <path d="M-126,176 L-126,-24 Q-126,-140 0,-140 Q126,-140 126,-24 L126,176Z" fill="#FBF7F2"/>
    <!-- Warm glow -->
    <ellipse cx="0" cy="-79" rx="65" ry="40" fill="#F5D4A0" opacity="0.25"/>
    <!-- Upper shelf -->
    <rect x="-126" y="26" width="252" height="12" rx="1" fill="#A67B5B"/>
    <!-- Books upper -->
    <rect x="-108" y="-69" width="30" height="95" rx="4" fill="#D4836A"/>
    <rect x="-73" y="-49" width="26" height="75" rx="4" fill="#C4956A"/>
    <rect x="-42" y="-62" width="28" height="88" rx="4" fill="#D4A574"/>
    <rect x="-8" y="-54" width="32" height="80" rx="4" fill="#B8906A"/>
    <rect x="30" y="-64" width="26" height="90" rx="4" fill="#E8C9A8"/>
    <rect x="61" y="-49" width="28" height="75" rx="4" fill="#C4956A"/>
    <!-- Plant -->
    <g transform="translate(102, 21)">
      <rect x="-7" y="-10" width="14" height="10" rx="3" fill="#A67B5B"/>
      <ellipse cx="0" cy="-18" rx="10" ry="9" fill="#8B9E6B" opacity="0.8"/>
      <ellipse cx="-7" cy="-23" rx="7" ry="6" fill="#8B9E6B" opacity="0.6"/>
      <ellipse cx="7" cy="-22" rx="7" ry="6" fill="#9BAF7B" opacity="0.7"/>
    </g>
    <!-- Lower shelf -->
    <rect x="-126" y="146" width="252" height="12" rx="1" fill="#A67B5B"/>
    <!-- Books lower -->
    <rect x="-108" y="48" width="32" height="98" rx="4" fill="#E8C9A8"/>
    <rect x="-71" y="61" width="28" height="85" rx="4" fill="#D4836A"/>
    <rect x="-38" y="44" width="30" height="102" rx="4" fill="#B8906A"/>
    <rect x="-2" y="56" width="26" height="90" rx="4" fill="#D4A574"/>
    <rect x="29" y="48" width="30" height="98" rx="4" fill="#C4956A"/>
    <rect x="64" y="64" width="26" height="82" rx="4" fill="#E8C9A8"/>
  </g>
</svg>